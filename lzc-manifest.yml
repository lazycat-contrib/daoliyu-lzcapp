application:
  subdomain: daoliyu
  multi_instance: true
  upstreams:
    - location: /
      backend: http://daoliyu-music:4000/
  public_path:
    - /
services:
  daoliyu-music:
    # upstream: docker.io/msmkls/daoliyu-music:1.0.0
    image: docker.1ms.run/msmkls/daoliyu-music:1.0.0
    environment:
      - DLY_DB_DRIVER=sqlite
      - DLY_LOG_MIRROR_CONSOLE=true
      - TZ=Asia/Shanghai
    setup_script: |
      if [ ! -s /host/etc/machine-id ]; then
        machine_id="$(tr -d '-' < /proc/sys/kernel/random/uuid)"
        printf '%s\n' "$machine_id" > /host/etc/machine-id
      fi
    binds:
      - /lzcapp/var/data:/app/runtime/data
      - /lzcapp/run/mnt/home/{{ .U.library_dir }}:/app/runtime/library
      - /lzcapp/var/cache/transcoding:/app/runtime/cache/transcoding
      - /lzcapp/var/machine-id:/host/etc
ext_config:
  enable_document_access: true
usage: "每位用户运行独立实例；音乐库默认读取懒猫用户目录下的 music 文件夹。首次打开后按应用自身引导完成初始化。"
